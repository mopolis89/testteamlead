<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>API заметок</title>
    <!-- swagger-ui грузим с CDN, тащить его в зависимости ради одной страницы не хочется -->
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      // документацию строим по openapi.yaml, он лежит в корне сайта
      window.onload = () => {
        SwaggerUIBundle({
          url: '/openapi.yaml',
          dom_id: '#swagger-ui',
        })
      }
    </script>
  </body>
</html>
