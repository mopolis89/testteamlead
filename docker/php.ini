; не показываем версию PHP в заголовках ответа
expose_php = Off
; ошибки не выводим в ответ (там должен быть чистый JSON), а пишем в лог контейнера
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; все даты на сервере в UTC, в местное время переводит браузер
date.timezone = UTC
memory_limit = 128M
max_execution_time = 30
