<VirtualHost *:80>
    ServerName localhost
    # наружу видна только папка public, код и база лежат выше
    DocumentRoot /var/www/html/public
    # на главной отдаём собранный фронт, а не index.php
    DirectoryIndex index.html

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted

        # всё, что начинается с /api, отдаём в index.php
        RewriteEngine On
        RewriteRule ^api(/.*)?$ index.php [L,QSA]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
